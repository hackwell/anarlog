# Turns a verified desktop CD candidate into the public GitHub Release.
# desktop_cd.yaml calls this at the end of a tag build with source_run_id set to
# its own run, so a pushed tag releases in one action. The workflow_dispatch
# trigger remains for republishing an earlier candidate run by hand.
on:
  workflow_call:
    inputs:
      version:
        description: "Version to publish (e.g., 1.0.2)"
        required: true
        type: string
      candidate_sha:
        description: "Exact 40-character commit used to build the candidate"
        required: true
        type: string
      source_run_id:
        description: "Desktop CD run that staged the candidate assets"
        required: true
        type: string
      tag_release:
        description: "The candidate came from a pushed release tag"
        required: false
        type: boolean
        default: false
      include_linux:
        description: "Publish Linux beta artifacts from the candidate"
        type: boolean
        default: true
      include_windows:
        description: "Publish Windows artifacts from the candidate"
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g., 1.0.2)"
        required: true
        type: string
      candidate_sha:
        description: "Exact 40-character main commit used to build the candidate"
        required: true
        type: string
      source_run_id:
        description: "Successful publish=false desktop CD run that built the candidate"
        required: true
        type: string
      tag_release:
        description: "Leave false: only desktop_cd sets this for a tag build"
        required: false
        type: boolean
        default: false
      include_linux:
        description: "Publish Linux beta artifacts from the candidate"
        type: boolean
        default: true
      include_windows:
        description: "Publish Windows artifacts from the candidate"
        type: boolean
        default: true

concurrency:
  # desktop_cd already holds `desktop-stable-release` for the whole tag run, and
  # a called workflow that requested the group its own caller holds would wait
  # for a slot that can never free. The in-run call therefore takes a run-scoped
  # group; a standalone dispatch keeps the shared lock that serialises releases.
  group: ${{ inputs.source_run_id == format('{0}', github.run_id) && format('desktop-stable-release-{0}', github.run_id) || 'desktop-stable-release' }}
  cancel-in-progress: false

jobs:
  parse:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.parse.outputs.version }}
      channel: ${{ steps.parse.outputs.channel }}
      candidate_sha: ${{ steps.parse.outputs.candidate_sha }}
      source_run_id: ${{ steps.parse.outputs.source_run_id }}
      same_run: ${{ steps.parse.outputs.same_run }}
      tag_release: ${{ steps.parse.outputs.tag_release }}
      include_linux: ${{ steps.parse.outputs.include_linux }}
      include_windows: ${{ steps.parse.outputs.include_windows }}
    steps:
      - id: parse
        env:
          EXECUTION_REF: ${{ github.ref }}
          EXECUTION_SHA: ${{ github.sha }}
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          INPUT_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          INPUT_TAG_RELEASE: ${{ inputs.tag_release }}
          INPUT_INCLUDE_LINUX: ${{ inputs.include_linux }}
          INPUT_INCLUDE_WINDOWS: ${{ inputs.include_windows }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be a stable semantic version such as 1.4.0"
            exit 1
          fi

          if [[ ! "$INPUT_CANDIDATE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::Candidate SHA must be a full 40-character commit SHA"
            exit 1
          fi
          if [[ ! "$INPUT_SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Source workflow run ID must be a positive integer"
            exit 1
          fi

          VERSION="$INPUT_VERSION"
          CANDIDATE_SHA="${INPUT_CANDIDATE_SHA,,}"

          # desktop_cd calls this workflow from inside the tag build, so the
          # staged assets live in the run that is still executing. Everything
          # that reads them branches on this flag.
          SAME_RUN="false"
          if [[ "$INPUT_SOURCE_RUN_ID" == "$GITHUB_RUN_ID" ]]; then
            SAME_RUN="true"
          fi

          if [[ "$INPUT_TAG_RELEASE" == "true" ]]; then
            # The pushed tag is the version of record; it must spell out
            # exactly the version this run is about to publish.
            if [[ "$EXECUTION_REF" != "refs/tags/v$VERSION" ]]; then
              echo "::error::Tagged publication must run from refs/tags/v$VERSION, not $EXECUTION_REF"
              exit 1
            fi
          elif [[ "$EXECUTION_REF" != "refs/heads/main" ]]; then
            echo "::error::Stable publication must run from refs/heads/main, not $EXECUTION_REF"
            exit 1
          fi
          if [[ "${EXECUTION_SHA,,}" != "$CANDIDATE_SHA" ]]; then
            echo "::error::Executing workflow SHA $EXECUTION_SHA does not match candidate $CANDIDATE_SHA"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "channel=stable" >> $GITHUB_OUTPUT
          echo "candidate_sha=$CANDIDATE_SHA" >> $GITHUB_OUTPUT
          echo "source_run_id=$INPUT_SOURCE_RUN_ID" >> $GITHUB_OUTPUT
          echo "same_run=$SAME_RUN" >> $GITHUB_OUTPUT
          echo "tag_release=$INPUT_TAG_RELEASE" >> $GITHUB_OUTPUT
          echo "include_linux=$INPUT_INCLUDE_LINUX" >> $GITHUB_OUTPUT
          echo "include_windows=$INPUT_INCLUDE_WINDOWS" >> $GITHUB_OUTPUT

  verify-candidate:
    needs: parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.parse.outputs.candidate_sha }}
          fetch-depth: 0
          fetch-tags: true
      - env:
          EXPECTED_SHA: ${{ needs.parse.outputs.candidate_sha }}
          TAG_RELEASE: ${{ needs.parse.outputs.tag_release }}
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          git fetch origin main --no-tags

          TARGET=$(git rev-parse HEAD)
          MAIN=$(git rev-parse origin/main)

          if [[ "$TARGET" != "$EXPECTED_SHA" ]]; then
            echo "::error::Checked out $TARGET instead of candidate $EXPECTED_SHA"
            exit 1
          fi

          if [[ "$TAG_RELEASE" == "true" ]]; then
            # main moves while the build runs; the tag, not main's tip, is what
            # pins a tagged candidate.
            if ! git merge-base --is-ancestor "$EXPECTED_SHA" "$MAIN"; then
              echo "::error::Candidate $EXPECTED_SHA is not contained in main ($MAIN)"
              exit 1
            fi
          elif [[ "$MAIN" != "$EXPECTED_SHA" ]]; then
            echo "::error::Candidate $EXPECTED_SHA is not the current main commit ($MAIN)"
            exit 1
          fi

          if [[ ! -f "packages/changelog/content/$VERSION.md" ]]; then
            echo "::error::Missing changelog for $VERSION at candidate $EXPECTED_SHA"
            exit 1
          fi

  verify-windows-signature:
    if: ${{ needs.parse.outputs.include_windows == 'true' }}
    needs: [parse, verify-candidate]
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.parse.outputs.candidate_sha }}
      - if: ${{ needs.parse.outputs.same_run == 'true' }}
        name: Take the candidate Windows installer from this run
        uses: actions/download-artifact@v4
        with:
          name: desktop-release-assets-x86_64-pc-windows-msvc
          path: windows-candidate
      - if: ${{ needs.parse.outputs.same_run != 'true' }}
        name: Download the candidate Windows installer
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ needs.parse.outputs.source_run_id }}
        run: |
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "desktop-release-assets-x86_64-pc-windows-msvc" \
            --dir windows-candidate
      - shell: bash
        run: cp windows-candidate/anarlog-windows-x86_64-setup.exe .
      - shell: pwsh
        env:
          WINDOWS_SIGNER_ORGANIZATION: ${{ vars.WINDOWS_SIGNER_ORGANIZATION }}
        run: |
          $signature = Get-AuthenticodeSignature "anarlog-windows-x86_64-setup.exe"
          if ($signature.Status -ne "Valid") {
            throw "Invalid Windows Authenticode signature: $($signature.Status)"
          }
          if (-not $signature.SignerCertificate) {
            throw "Windows Authenticode signer certificate is missing"
          }
          $signerOrganization = $signature.SignerCertificate.GetNameInfo(
            [System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
            $false
          )
          if ($signerOrganization -ne $env:WINDOWS_SIGNER_ORGANIZATION) {
            throw "Unexpected Windows Authenticode signer '$signerOrganization'"
          }
          if (-not $signature.TimeStamperCertificate) {
            throw "Windows Authenticode signature is missing a trusted timestamp"
          }

  tag-candidate:
    needs: [parse, verify-candidate, verify-windows-signature]
    if: ${{ !cancelled() && needs.parse.result == 'success' && needs.verify-candidate.result == 'success' && (needs.parse.outputs.include_windows != 'true' || needs.verify-windows-signature.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.parse.outputs.candidate_sha }}
          fetch-depth: 0
          fetch-tags: true
      - run: ./scripts/version.sh "./apps/desktop/src-tauri/tauri.conf.json" "${{ needs.parse.outputs.version }}"
      - name: Verify the staging run identity
        env:
          EXPECTED_SHA: ${{ needs.parse.outputs.candidate_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ needs.parse.outputs.source_run_id }}
          SAME_RUN: ${{ needs.parse.outputs.same_run }}
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          RUN=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID")

          if [[ "$SAME_RUN" == "true" ]]; then
            # desktop_cd calls this workflow from inside the tag build, so the
            # staging run is the one still executing and can never report
            # "completed". Being this very run is the stronger identity check,
            # and the jobs that staged the assets are already green because this
            # job only starts once they have succeeded.
            if [[ "$RUN_ID" != "$GITHUB_RUN_ID" ]]; then
              echo "::error::Run $RUN_ID is not the executing run $GITHUB_RUN_ID"
              exit 1
            fi
            STATE="true"
            EVENT='.event == "push"'
          else
            # A candidate comes either from a stable dispatch or from a tag
            # build whose publication has to be retried by hand.
            STATE='.status == "completed" and .conclusion == "success"'
            EVENT='(.event == "workflow_dispatch" or .event == "push")'
          fi

          if ! echo "$RUN" | jq -e \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$EXPECTED_SHA" \
            --arg workflow ".github/workflows/desktop_cd.yaml" \
            --argjson run_id "$RUN_ID" \
            "
              .id == \$run_id
              and ($STATE)
              and .run_attempt == 1
              and ($EVENT)
              and (.head_sha | ascii_downcase) == \$sha
              and .repository.full_name == \$repo
              and .head_repository.full_name == \$repo
              and (.path | split(\"@\")[0]) == \$workflow
            " > /dev/null; then
            echo "::error::Run $RUN_ID is not an unrerun, successful desktop CD run for candidate $EXPECTED_SHA"
            exit 1
          fi
      - if: ${{ needs.parse.outputs.same_run == 'true' }}
        name: Take candidate provenance from this run
        uses: actions/download-artifact@v4
        with:
          name: desktop-release-provenance-${{ needs.parse.outputs.version }}-${{ needs.parse.outputs.candidate_sha }}
          path: release-provenance
      - if: ${{ needs.parse.outputs.same_run != 'true' }}
        name: Download candidate provenance
        env:
          EXPECTED_SHA: ${{ needs.parse.outputs.candidate_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ needs.parse.outputs.source_run_id }}
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "desktop-release-provenance-$VERSION-$EXPECTED_SHA" \
            --dir release-provenance
      - if: ${{ needs.parse.outputs.same_run == 'true' }}
        name: Take the candidate release assets from this run
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-release-assets-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets
      - if: ${{ needs.parse.outputs.same_run != 'true' }}
        name: Download the candidate release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ needs.parse.outputs.source_run_id }}
        run: |
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "desktop-release-assets-*" \
            --dir "$RUNNER_TEMP/staged-assets"
          # gh run download nests per-artifact directories when it matches more
          # than one artifact, and extracts flat when it matches exactly one.
          mkdir -p "$RUNNER_TEMP/release-assets"
          find "$RUNNER_TEMP/staged-assets" -mindepth 1 -maxdepth 2 -type f \
            -exec mv -n {} "$RUNNER_TEMP/release-assets/" ';'
      - name: Verify the candidate release against the release plan
        env:
          INCLUDE_LINUX: ${{ needs.parse.outputs.include_linux }}
          INCLUDE_WINDOWS: ${{ needs.parse.outputs.include_windows }}
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          node scripts/desktop-release-assets.mjs merge \
            --asset-dir "$RUNNER_TEMP/release-assets" \
            --output "$RUNNER_TEMP/release.json" \
            --version "$VERSION" \
            --include-linux "$INCLUDE_LINUX" \
            --include-windows "$INCLUDE_WINDOWS"
          node scripts/desktop-release-provenance.mjs verify-platforms \
            --release "$RUNNER_TEMP/release.json" \
            --include-linux "$INCLUDE_LINUX" \
            --include-windows "$INCLUDE_WINDOWS"
      - name: Verify candidate provenance
        env:
          EXPECTED_SHA: ${{ needs.parse.outputs.candidate_sha }}
          RUN_ID: ${{ needs.parse.outputs.source_run_id }}
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          node scripts/desktop-release-provenance.mjs verify \
            --release "$RUNNER_TEMP/release.json" \
            --manifest release-provenance/manifest.json \
            --version "$VERSION" \
            --candidate-sha "$EXPECTED_SHA" \
            --run-id "$RUN_ID" \
            --asset-dir "$RUNNER_TEMP/release-assets"
      # The release assets are published under `desktop_v<version>`, which is
      # what latest.json, the AUR package, the APT repository and the store
      # workflow all address. The pushed `v<version>` tag triggers the release;
      # this is the tag the artifacts hang on.
      - name: Create immutable release tag
        env:
          EXPECTED_SHA: ${{ needs.parse.outputs.candidate_sha }}
          TAG_RELEASE: ${{ needs.parse.outputs.tag_release }}
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          git fetch origin main --no-tags
          git fetch --tags --force

          TARGET=$(git rev-parse HEAD)
          MAIN=$(git rev-parse origin/main)
          TAG="desktop_v$VERSION"
          EXISTING=$(git rev-parse -q --verify "refs/tags/$TAG" || true)

          if [[ "$TARGET" != "$EXPECTED_SHA" ]]; then
            echo "::error::Candidate moved before publication (candidate=$EXPECTED_SHA, checkout=$TARGET)"
            exit 1
          fi
          if [[ "$TAG_RELEASE" == "true" ]]; then
            if ! git merge-base --is-ancestor "$EXPECTED_SHA" "$MAIN"; then
              echo "::error::Candidate $EXPECTED_SHA is no longer contained in main ($MAIN)"
              exit 1
            fi
          elif [[ "$MAIN" != "$EXPECTED_SHA" ]]; then
            echo "::error::Candidate moved before publication (candidate=$EXPECTED_SHA, main=$MAIN)"
            exit 1
          fi

          if [[ -n "$EXISTING" ]]; then
            if [[ "$EXISTING" != "$EXPECTED_SHA" ]]; then
              echo "::error::Tag $TAG points to $EXISTING instead of candidate $EXPECTED_SHA"
              exit 1
            fi

            echo "Tag $TAG already points to candidate $EXPECTED_SHA"
          else
            git tag "$TAG" "$EXPECTED_SHA"
            git push origin "refs/tags/$TAG"
          fi

  gh-release:
    needs: [parse, tag-candidate]
    if: ${{ !cancelled() && needs.parse.result == 'success' && needs.tag-candidate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      # Releases live in this repository now, so the built-in token publishes
      # them. No cross-repository PAT is involved anywhere in the release path.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.parse.outputs.candidate_sha }}
          fetch-depth: 0
          fetch-tags: true
      - id: releases
        uses: ./.github/actions/release_repository
      - env:
          EXPECTED_SHA: ${{ needs.parse.outputs.candidate_sha }}
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          git fetch --tags --force

          TAG="desktop_v$VERSION"
          TAG_TARGET=$(git rev-parse "$TAG^{commit}")
          if [[ "$TAG_TARGET" != "$EXPECTED_SHA" ]]; then
            echo "::error::Tag $TAG points to $TAG_TARGET instead of candidate $EXPECTED_SHA"
            exit 1
          fi
      - if: ${{ needs.parse.outputs.same_run == 'true' }}
        name: Take candidate provenance from this run
        uses: actions/download-artifact@v4
        with:
          name: desktop-release-provenance-${{ needs.parse.outputs.version }}-${{ needs.parse.outputs.candidate_sha }}
          path: release-provenance
      - if: ${{ needs.parse.outputs.same_run != 'true' }}
        name: Download candidate provenance
        env:
          EXPECTED_SHA: ${{ needs.parse.outputs.candidate_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ needs.parse.outputs.source_run_id }}
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "desktop-release-provenance-$VERSION-$EXPECTED_SHA" \
            --dir release-provenance
      - if: ${{ needs.parse.outputs.same_run == 'true' }}
        name: Take the candidate release assets from this run
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-release-assets-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets
      - if: ${{ needs.parse.outputs.same_run != 'true' }}
        name: Download the candidate release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ needs.parse.outputs.source_run_id }}
        run: |
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "desktop-release-assets-*" \
            --dir "$RUNNER_TEMP/staged-assets"
          # gh run download nests per-artifact directories when it matches more
          # than one artifact, and extracts flat when it matches exactly one.
          mkdir -p "$RUNNER_TEMP/release-assets"
          find "$RUNNER_TEMP/staged-assets" -mindepth 1 -maxdepth 2 -type f \
            -exec mv -n {} "$RUNNER_TEMP/release-assets/" ';'
      - name: Verify the release assets against provenance
        env:
          EXPECTED_SHA: ${{ needs.parse.outputs.candidate_sha }}
          INCLUDE_LINUX: ${{ needs.parse.outputs.include_linux }}
          INCLUDE_WINDOWS: ${{ needs.parse.outputs.include_windows }}
          RUN_ID: ${{ needs.parse.outputs.source_run_id }}
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          node scripts/desktop-release-assets.mjs merge \
            --asset-dir "$RUNNER_TEMP/release-assets" \
            --output "$RUNNER_TEMP/release.json" \
            --version "$VERSION" \
            --include-linux "$INCLUDE_LINUX" \
            --include-windows "$INCLUDE_WINDOWS"
          node scripts/desktop-release-provenance.mjs verify \
            --release "$RUNNER_TEMP/release.json" \
            --manifest release-provenance/manifest.json \
            --version "$VERSION" \
            --candidate-sha "$EXPECTED_SHA" \
            --run-id "$RUN_ID" \
            --asset-dir "$RUNNER_TEMP/release-assets"
      - id: assemble
        name: Assemble the release payload
        env:
          INCLUDE_LINUX: ${{ needs.parse.outputs.include_linux }}
          INCLUDE_WINDOWS: ${{ needs.parse.outputs.include_windows }}
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          upload_dir="$RUNNER_TEMP/release-upload"
          mkdir -p "$upload_dir"

          # latest.json is what the shipped updater polls; its platform keys and
          # signatures come from the release plan and the .sig files tauri build
          # wrote beside each updater artifact.
          node scripts/desktop-latest-json.mjs \
            --asset-dir "$RUNNER_TEMP/release-assets" \
            --output "$upload_dir/latest.json" \
            --version "$VERSION" \
            --notes "https://sessionecho.flagbit.de/changelog/$VERSION" \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --include-linux "$INCLUDE_LINUX" \
            --include-windows "$INCLUDE_WINDOWS"

          while IFS= read -r asset; do
            cp "$RUNNER_TEMP/release-assets/$asset" "$upload_dir/$asset"
            (cd "$upload_dir" && sha256sum "$asset" > "$asset.sha256")
          done < <(node scripts/desktop-release-assets.mjs list \
            --include-linux "$INCLUDE_LINUX" \
            --include-windows "$INCLUDE_WINDOWS")

          # The AUR package reads the licence from the release: the source
          # repository is private, so a tag URL is not reachable.
          cp LICENSE "$upload_dir/LICENSE"

          echo "upload_dir=$upload_dir" >> "$GITHUB_OUTPUT"
          ls -l "$upload_dir"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES_REPOSITORY: ${{ steps.releases.outputs.repository }}
          UPLOAD_DIR: ${{ steps.assemble.outputs.upload_dir }}
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          TAG="desktop_v$VERSION"
          if gh release view "$TAG" --repo "$RELEASES_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" --repo "$RELEASES_REPOSITORY" --clobber "$UPLOAD_DIR"/*
            gh release edit "$TAG" --repo "$RELEASES_REPOSITORY" \
              --title "$TAG" \
              --notes "https://sessionecho.flagbit.de/changelog/$VERSION" \
              --draft=false \
              --prerelease=false \
              --latest
          else
            gh release create "$TAG" --repo "$RELEASES_REPOSITORY" \
              --title "$TAG" \
              --notes "https://sessionecho.flagbit.de/changelog/$VERSION" \
              --latest \
              "$UPLOAD_DIR"/*
          fi
      - name: Verify the published updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASES_REPOSITORY: ${{ steps.releases.outputs.repository }}
          UPLOAD_DIR: ${{ steps.assemble.outputs.upload_dir }}
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          published_dir="$RUNNER_TEMP/published"
          mkdir -p "$published_dir"
          gh release download "desktop_v$VERSION" \
            --repo "$RELEASES_REPOSITORY" \
            --pattern latest.json \
            --dir "$published_dir" \
            --clobber
          published="$published_dir/latest.json"
          if ! diff -u "$UPLOAD_DIR/latest.json" "$published"; then
            echo "::error::The published latest.json does not match the one this run generated"
            exit 1
          fi
          jq -e --arg version "$VERSION" '.version == $version and (.platforms | length) > 0' "$published"
      - name: Summarize the release
        env:
          INCLUDE_WINDOWS: ${{ needs.parse.outputs.include_windows }}
          RELEASES_REPOSITORY: ${{ steps.releases.outputs.repository }}
          UPLOAD_DIR: ${{ steps.assemble.outputs.upload_dir }}
          VERSION: ${{ needs.parse.outputs.version }}
        run: |
          {
            echo "## Release"
            echo "- Repository: \`$RELEASES_REPOSITORY\`"
            echo "- Tag: \`desktop_v$VERSION\`"
            echo "- Updater platforms: \`$(jq -r '.platforms | keys | join(", ")' "$UPLOAD_DIR/latest.json")\`"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$INCLUDE_WINDOWS" == "true" ]]; then
            package="anarlog-windows-x86_64-setup.exe"
            {
              echo "## Microsoft Store submission"
              echo "- Package URL: \`https://github.com/$RELEASES_REPOSITORY/releases/download/desktop_v$VERSION/$package\`"
              echo "- SHA-256: \`$(sha256sum "$UPLOAD_DIR/$package" | cut -d ' ' -f 1)\`"
              echo "- Silent install argument: \`/S\`"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
