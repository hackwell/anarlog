name: Verify release repository access
description: >-
  Fail in seconds, before any build starts, if RELEASES_TOKEN cannot write to
  the public releases repository.

inputs:
  token:
    description: Cross-repository token with Contents write on the releases repository
    required: true

outputs:
  repository:
    description: The releases repository read from the release plan
    value: ${{ steps.preflight.outputs.repository }}

runs:
  using: composite
  steps:
    - id: preflight
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        REPOSITORY=$(jq -er '.releaseRepository' scripts/desktop-release-platforms.json)
        if [[ ! "$REPOSITORY" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$ ]]; then
          echo "::error::Release plan has no valid releaseRepository, got '$REPOSITORY'"
          exit 1
        fi
        echo "repository=$REPOSITORY" >> "$GITHUB_OUTPUT"

        if [[ -z "${GH_TOKEN:-}" ]]; then
          echo "::error::Secret RELEASES_TOKEN is not set; releases are published to $REPOSITORY, which the built-in GITHUB_TOKEN cannot write to"
          exit 1
        fi

        if ! REPO_JSON=$(gh api "repos/$REPOSITORY" 2>&1); then
          echo "::error::Secret RELEASES_TOKEN cannot read $REPOSITORY. It is invalid, expired, or not granted access to that repository."
          echo "$REPO_JSON"
          exit 1
        fi

        PUSH=$(jq -r '.permissions.push // false' <<< "$REPO_JSON")
        if [[ "$PUSH" != "true" ]]; then
          echo "::error::Secret RELEASES_TOKEN has no write access to $REPOSITORY. Grant it Contents: read and write on that repository."
          exit 1
        fi

        if ! gh api "repos/$REPOSITORY/releases?per_page=1" > /dev/null 2>&1; then
          echo "::error::Secret RELEASES_TOKEN cannot list releases on $REPOSITORY. Grant it Contents: read and write on that repository."
          exit 1
        fi

        echo "RELEASES_TOKEN can publish releases to $REPOSITORY"
